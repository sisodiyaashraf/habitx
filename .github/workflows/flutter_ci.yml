name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to 3.41.2 — Flutter 3.44.x has a confirmed open regression that breaks
          # `flutter build appbundle --release` (strip-debug-symbols step fails after Gradle
          # succeeds). See: https://github.com/flutter/flutter/issues/186810
          # Safe to bump once that issue is closed/fixed in a later 3.44.x or 3.45.x release.
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: |
          echo "=================================="
          flutter --version
          echo "=================================="
          FLUTTER_VER=$(flutter --version | head -n 1 | awk '{print $2}')
          if [[ "$FLUTTER_VER" != "3.41.2" ]]; then
            echo "ERROR: Expected Flutter 3.41.2 but got $FLUTTER_VER"
            exit 1
          fi
          echo "Confirmed: running Flutter 3.41.2 as expected."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code syntax
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Run Flutter Doctor Diagnostics
        run: flutter doctor -v

      - name: Build release app bundle (direct Gradle, bypassing Flutter's broken post-build check)
        run: |
          flutter pub get
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
